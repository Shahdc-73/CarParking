server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API lives behind the same origin as the app: no CORS, and the refresh cookie (SameSite=Strict) just works.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
  }

  # SignalR: the WebSocket upgrade headers must be passed on, and idle sockets must not be cut after the default 60 s.
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_buffering off;
    include /etc/nginx/security-headers.conf;
  }

  # Build output has content hashes in file names, so it can be cached forever.
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # Single-page app: unknown paths (deep links like /login or /my) get index.html and the Angular router takes over.
  # index.html itself must never be cached, or users would keep loading old bundles.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
