<a class="skip-link" href="#main">Skip to main content</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    #nav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
    class="sidenav"
  >
    <div class="sidenav-header">
      <span class="logo" aria-hidden="true"><mat-icon>local_parking</mat-icon></span>
      <div>
        <div class="app-name">ParkWise</div>
        <div class="app-tagline">Parking management</div>
      </div>
    </div>

    <nav aria-label="Main">
      <mat-nav-list>
        @for (item of items(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #link="routerLinkActive"
            [activated]="link.isActive"
            ariaCurrentWhenActive="page"
            (click)="closeIfHandset(nav)"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation menu"
          (click)="nav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="brand">ParkWise</span>
      }
      <span class="spacer"></span>

      @if (user(); as u) {
        <button type="button" [matMenuTriggerFor]="userMenu" class="user-button">
          <span class="avatar" aria-hidden="true">{{ initialsOf(u.fullName) }}</span>
          <span class="user-text">
            <span class="user-name">{{ u.fullName }}</span>
            <span class="user-role">{{ roleOf(u.roles) }}</span>
          </span>
          <span class="material-icons chevron" aria-hidden="true">arrow_drop_down</span>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="menu-header" role="presentation">
            <span class="avatar large" aria-hidden="true">{{ initialsOf(u.fullName) }}</span>
            <strong>{{ u.fullName }}</strong>
            <span>{{ u.email }}</span>
            <span class="role-chip">{{ roleOf(u.roles) }}</span>
          </div>
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon aria-hidden="true">logout</mat-icon>
            <span>Sign out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main id="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
